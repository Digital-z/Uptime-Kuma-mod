version: "3.8"

services:
  uptime-kuma:
    build:
      context: .
      dockerfile: Dockerfile.minimal
    image: gfxy/uptime-kuma-mod:v1.0-mod
    container_name: uptime-kuma-mod
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      # 禁用内置MariaDB
      - UPTIME_KUMA_ENABLE_EMBEDDED_MARIADB=0
    healthcheck:
      test: ["CMD", "/app/extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    # 限制资源使用（可选）
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 500M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 200M
